<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار مراجعة أحكام النون الساكنة والتنوين</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1b2a22;--ac:#1f7a4d;--mut:#5d6b63;--bd:#d5e0d9;--ok:#1f7a4d;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--tx:#e8f0eb;--ac:#4cc38a;--mut:#9fb0a6;--bd:#2e3d35;--ok:#4cc38a;--no:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.4rem;color:var(--ac);text-align:center;margin:8px 0}
.sup{text-align:center;color:var(--mut);margin-bottom:16px}
.pledge{display:flex;gap:10px;align-items:flex-start;font-size:1.05rem;cursor:pointer}
.pledge input{width:24px;height:24px;margin-top:4px;accent-color:var(--ac)}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1.05rem;cursor:pointer;margin-top:14px}
button:disabled{opacity:.4;cursor:not-allowed}
.q{font-weight:bold;margin-bottom:8px}
.o{display:block;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
.o input{margin-left:8px;accent-color:var(--ac)}
.ok{border-color:var(--ok);background:rgba(31,122,77,.12)}
.no{border-color:var(--no);background:rgba(179,38,30,.1)}
.hide{display:none}
.score{font-size:1.6rem;text-align:center;color:var(--ac);font-weight:bold}
</style>
</head>
<body>
<div class="wrap">

<div id="p1" class="card">
  <h1>اختبار مراجعة أحكام النون الساكنة والتنوين</h1>
  <div class="sup">إشراف المعلم: أ. عبدالعزيز الديني</div>
  <label class="pledge">
    <input type="checkbox" id="pl">
    <span>أتعهد بالله أن أؤدي هذا الاختبار بنفسي، وأن لا أغش ولا أستعين بأحد أو بأي وسيلة.</span>
  </label>
  <button id="start" disabled>ابدأ الاختبار</button>
</div>

<div id="p2" class="hide">
  <form id="f"></form>
  <button id="sub" type="button">إنهاء وعرض النتيجة</button>
  <div id="res" class="card hide"></div>
</div>

</div>
<script>
var Q=[
{q:"أي الأمثلة التالية فيها إدغام كامل (بلا غنة)؟",o:["مِن رَّبِّهِمْ","مَن يَقُولُ","مِن بَعْدِ","مَنْ آمَنَ"],a:0},
{q:"أي الأمثلة التالية فيها إدغام ناقص (بغنة)؟",o:["مِن لَّدُنْهُ","مَن يَقُولُ","مِن رَّبِّهِمْ","مِن شَرِّ"],a:1},
{q:"حرفا الإدغام الكامل بغير غنة هما:",o:["ي و","ل ر","م ن","ب"],a:1},
{q:"حروف الإدغام الناقص بغنة هي:",o:["ل ر","م ن","ي و","ب"],a:2},
{q:"ما حكم النون الساكنة في: مَنْ آمَنَ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:0},
{q:"ما حكم النون الساكنة في: مِنْ بَعْدِ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:2},
{q:"ما حكم النون الساكنة في: مَنْ كَانَ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:3},
{q:"ما حكم النون الساكنة في: مِن نَّارٍ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:1},
{q:"ما حكم التنوين في: عَلِيمٌ حَكِيمٌ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:0},
{q:"ما حكم التنوين في: سَمِيعٌ بَصِيرٌ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:2},
{q:"ما حكم التنوين في: جَنَّاتٍ تَجْرِي؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:3},
{q:"ما حكم التنوين في: غَفُورٌ رَّحِيمٌ؟",o:["إظهار","إدغام","إقلاب","إخفاء"],a:1},
{q:"حرفا الإدغام الكامل بغنة هما:",o:["ل ر","ي و","م ن","ب"],a:2},
{q:"حروف الإظهار الحلقي هي:",o:["ء هـ ع ح غ خ","ي ن م و","ل ر","ب فقط"],a:0},
{q:"الحرف الذي يأتي بعده الإقلاب هو:",o:["الميم","الباء","الواو","اللام"],a:1},
{q:"عدد حروف الإخفاء:",o:["ستة","ثمانية حروف","خمسة عشر حرفًا","حرف واحد"],a:2},
{q:"مقدار الغنة في الإدغام الناقص والإخفاء والإقلاب:",o:["حركة واحدة","حركتان","أربع حركات","ست حركات"],a:1},
{q:"كيف تُرسم النون الساكنة في المصحف عند الإظهار؟",o:["بسكون عليها","عارية من السكون","بشدّة","بميم صغيرة فوقها"],a:0},
{q:"كيف يُرسم التنوين عند الإظهار في المصحف؟",o:["حركتان متراكبتان","حركتان متتابعتان","حركة واحدة","ميم صغيرة"],a:0},
{q:"كيف يُرسم التنوين عند الإدغام والإخفاء في المصحف؟",o:["حركتان متراكبتان","حركتان متتابعتان","بسكون","بشدّة"],a:1},
{q:"كيف تُرسم النون الساكنة عند الإدغام في المصحف؟",o:["بسكون عليها","عارية من السكون","بميم صغيرة","بهمزة"],a:1},
{q:"كيف يُرسم الحرف المدغم بعد النون في الإدغام الكامل (مِن رَّبِّهِمْ)؟",o:["مشدّد","بسكون","بلا شدّة","بميم صغيرة"],a:0},
{q:"كيف يُرسم الحرف المدغم بعد النون في الإدغام الناقص (مَن يَقُولُ)؟",o:["مشدّد","من غير تشديد","بسكون","بميم صغيرة"],a:1},
{q:"ماذا يوضع فوق النون أو التنوين عند الإقلاب في المصحف؟",o:["سكون","شدّة","ميم صغيرة","همزة"],a:2},
{q:"كيف تُرسم النون الساكنة عند الإخفاء في المصحف؟",o:["بسكون عليها","عارية من السكون","بميم صغيرة","بشدّة"],a:1},
{q:"التنوين هو:",o:["نون متحركة تثبت وصلًا ووقفًا","نون ساكنة زائدة تلحق آخر الاسم لفظًا لا خطًّا ولا وقفًا","حرف يلحق أول الفعل","ميم ساكنة في آخر الاسم"],a:1},
{q:"ما الفرق بين النون الساكنة والتنوين؟",o:["النون الساكنة تكون في الاسم والفعل والحرف، والتنوين في الاسم فقط","التنوين يكون في الفعل فقط","لا فرق بينهما","النون الساكنة في آخر الكلمة فقط"],a:0},
{q:"ما حكم النون الساكنة في: مِن وَالٍ؟",o:["إدغام كامل (بلا غنة)","إدغام ناقص (بغنة)","إقلاب","إخفاء"],a:1},
{q:"ما حكم النون الساكنة في: مِن لَّدُنْهُ؟",o:["إدغام كامل (بلا غنة)","إدغام ناقص (بغنة)","إظهار","إخفاء"],a:0},
{q:"ما نوع الإدغام في: مِن مَّاءٍ؟",o:["إدغام كامل بغنة","إدغام ناقص بغنة","إدغام كامل بغير غنة","إخفاء"],a:0}
];
var f=document.getElementById("f");
Q.forEach(function(x,i){
  var d=document.createElement("div");d.className="card";d.id="q"+i;
  var h='<div class="q">'+(i+1)+') '+x.q+'</div>';
  x.o.forEach(function(t,j){h+='<label class="o" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'">'+t+'</label>';});
  d.innerHTML=h;f.appendChild(d);
});
var pl=document.getElementById("pl"),st=document.getElementById("start");
pl.onchange=function(){st.disabled=!pl.checked;};
st.onclick=function(){
  document.getElementById("p1").classList.add("hide");
  document.getElementById("p2").classList.remove("hide");
  window.scrollTo(0,0);
};
document.getElementById("sub").onclick=function(){
  var s=0;
  Q.forEach(function(x,i){
    var c=document.querySelector('input[name="q'+i+'"]:checked');
    if(c&&+c.value===x.a)s++;
    document.getElementById("o"+i+"_"+x.a).classList.add("ok");
    if(c&&+c.value!==x.a)document.getElementById("o"+i+"_"+c.value).classList.add("no");
  });
  var r=document.getElementById("res");
  r.className="card";
  r.innerHTML='<div class="score">النتيجة: '+s+' من '+Q.length+'</div>';
  this.disabled=true;
  r.scrollIntoView({behavior:"smooth"});
};
</script>
</body>
</html>
